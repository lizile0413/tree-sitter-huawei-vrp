name: Build WASM

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Build WASM
        run: npx tree-sitter build --wasm --output huawei-vrp/grammars/vrp.wasm

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: huawei-vrp-extension
          path: huawei-vrp/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tree-sitter-vrp.wasm
            huawei-vrp/extension.toml
            huawei-vrp/languages/vrp/config.toml
            huawei-vrp/languages/vrp/highlights.scm
            huawei-vrp/assets/theme_everedit.json
